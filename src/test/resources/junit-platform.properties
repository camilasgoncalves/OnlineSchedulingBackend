# Evita publicação automática no Cucumber Cloud
cucumber.publish.quiet=true

# Define pacotes do glue (onde estão os steps e hooks)
cucumber.glue=steps,hooks,services,utils

# Plugins de relatório e formatação
cucumber.plugin=pretty,\
  html:target/reports/cucumber-report.html,\
  json:target/reports/cucumber-report.json,\
  junit:target/reports/cucumber-junit.xml
